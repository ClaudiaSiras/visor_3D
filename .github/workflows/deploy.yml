name: Deploy to InfinityFree

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp build info into index.php
        shell: bash
        run: |
          BUILD="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          sed -i "s/__BUILD__/${BUILD}/g; s/__BUILD_DATE__/${BUILD_DATE}/g" release/index.php
          grep -n "version-badge" release/index.php || { echo "Build stamp not applied"; exit 1; }

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release/
          server-dir: /htdocs/
          dangerous-clean-slate: true
          timeout: 60000

      - name: Deploy release folder contents
        run: echo "Deployment to InfinityFree triggered"
        shell: bash
