name: Deploy to InfinityFree

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to InfinityFree via FTP
        uses: webfactory/ftp-deploy-action@master
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          source: /
          target: /public_html
          exclude: |
            .git
            .github
          timeout: 60

      - name: Deploy release folder contents
        run: echo "Deployment to InfinityFree triggered"
        shell: bash
